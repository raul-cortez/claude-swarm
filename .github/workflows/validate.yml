name: Validate

# Гоняет полную сюиту на каждый PR и каждый пуш в main.
#
# На гитлабе здесь стоял только `node --check` пяти файлов — то есть проверялось, что
# код парсится. Тесты пуре-нодовые и идут секунды, так что гонять их целиком ничего не
# стоит, а покрывают они несравнимо больше.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Бинарник Electron не нужен: сюита не запускает приложение, только читает и
      # проверяет чистую логику. Пакет при этом ставится, поэтому require.resolve
      # в тесте упаковки по-прежнему находит его.
      - name: Зависимости
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Тесты
        run: npm test
