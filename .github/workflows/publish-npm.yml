name: Publish npm installer

# Публикует пакет-установщик `claude-swarm` (папка npm/) в реестр npm.
#
# Токена в секретах нет и не должно быть: реестр доверяет этому workflow напрямую
# (npm Trusted Publishing). Гитхаб выдаёт заданию короткоживущий OIDC-токен, npm меняет
# его на право публикации ровно этого пакета и ровно из этого файла. Долгоживущий
# гранулярный токен, который надо помнить и продлевать, оттуда пропадает совсем.
#
# Настраивается это ОДИН РАЗ на npmjs.com, руками — см. «Установщик в npm» в
# DEVELOPMENT.md. Имя файла workflow там указывается дословно, поэтому переименование
# этого файла ломает публикацию, и чинится оно только там же, на сайте.
#
# Запуск только руками. Пакет-установщик живёт своей жизнью: его версия не связана с
# версией Swarm, и переиздавать его надо не на каждый релиз, а только когда поменялся
# scripts/install.sh. Автозапуск по тегу выпускал бы одно и то же снова и снова.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # тот самый OIDC-токен; без этой строки npm попросит логин

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm

    steps:
      - uses: actions/checkout@v5

      # Нода 24 нужна ради npm: доверенная публикация требует npm >= 11.5.1, а в
      # двадцатой ноде npm десятый.
      #
      # registry-url здесь СПЕЦИАЛЬНО не задан. С ним setup-node пишет в .npmrc строку
      # `_authToken=${NODE_AUTH_TOKEN}`, и она разворачивается в пустоту: токена-то у нас
      # нет. Дальше npm видит «авторизация настроена», за OIDC не идёт вовсе и падает с
      # ENEEDAUTH. Реестр по умолчанию и так registry.npmjs.org — задавать его незачем.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Версии инструментов
        run: node --version && npm --version

      # Реестр отказывает в переиздании занятой версии, но отказывает уже на публикации —
      # после сборки и с невнятной ошибкой. Проверяем заранее и говорим, что делать.
      - name: Версия ещё не занята
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "claude-swarm@$v" version >/dev/null 2>&1; then
            echo "claude-swarm@$v уже в реестре." >&2
            echo "Поднимите версию в npm/package.json (npm version patch) и запустите снова." >&2
            exit 1
          fi
          echo "публикуем claude-swarm@$v"

      # Зависимостей у пакета нет, ставить нечего. prepack сам положит рядом свежий
      # scripts/install.sh — ради него тут и нужен полный чекаут репозитория.
      #
      # Происхождение (provenance) реестр подпишет сам: при доверенной публикации из
      # публичного репозитория оно включается без флагов, и на странице пакета появляется
      # ссылка на этот самый прогон.
      - name: Публикация
        run: npm publish
