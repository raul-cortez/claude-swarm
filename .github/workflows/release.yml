name: Release

# Собирает виндовую и линуксовую части релиза и публикует его.
#
# Разделение труда: мак-половину (.dmg, app.asar, manifest.json) выкладывает
# scripts/release.mjs с машины автора — подпись у нас ad-hoc, поэтому мак собирается за
# клавиатурой, а не на раннере. Здесь добавляются .exe, .AppImage и .deb.
#
# Последний шаг — СНЯТЬ ЧЕРНОВИК, и это несущая часть схемы, а не формальность.
# Обновлялка ходит за releases/latest/download/manifest.json, а `latest` у гитхаба
# черновики игнорирует. Значит пока .exe и .AppImage не собраны, версии для обновлялки не
# существует, и никто не может попасть в окно, где манифест обещает установщик, которого
# ещё нет. Поэтому публикация — отдельной задачей, которая ждёт ОБЕ сборки: упади одна, и
# релиз останется черновиком, а не выйдет без половины установщиков.
#
# Запуск вручную (workflow_dispatch) собирает установщики и кладёт артефактами, ничего не
# публикуя, — этим удобно проверять сборки, не выпуская версию.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # доливать ассеты и публиковать релиз

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # node-pty здесь — форк с прибилдами: prebuild-install скачивает готовый бинарник
      # под нашу цель Electron, поэтому ни компилятора, ни Python не нужно. Переменные
      # говорят ему взять электронную сборку, а не нодовую.
      #
      # Саму дев-версию Electron не качаем: мы её не запускаем, только упаковываем, а
      # дистрибутив для упаковки electron-builder берёт себе сам.
      - name: Зависимости
        run: npm ci
        env:
          npm_config_runtime: electron
          npm_config_target: 29.4.6
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Без этого файла обновлялка в собранном приложении выключена (см. enabled() в
      # updater.js). Токенов внутри больше нет — только отпечаток рантайма.
      - name: build-info.json
        run: node scripts/write-build-info.mjs

      # --publish never обязателен. На теге electron-builder иначе пытается опубликовать
      # релиз САМ, своим представлением о том, как он должен выглядеть, — и на гитхабе,
      # где у него теперь есть рабочий токен, это не падение сборки, а тихая порча нашего
      # черновика. Публикуем только шагами ниже.
      - name: Сборка установщика
        run: npm run dist:win -- --publish never

      - name: Что собралось
        shell: bash
        run: ls -la dist/*.exe

      - name: Дождаться черновика релиза
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # Черновик создаёт release.mjs через секунды после пуша тега, а мы к этому
          # моменту собирали .exe минуты — он почти наверняка уже на месте. «Почти» тут
          # мало: без релиза следующий шаг упал бы, и тег остался бы вообще без виндового
          # установщика, причём заметили бы это не сразу.
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "релиз $GITHUB_REF_NAME на месте"
              exit 0
            fi
            echo "ждём релиз $GITHUB_REF_NAME … ($i/30)"
            sleep 10
          done
          echo "релиз $GITHUB_REF_NAME так и не появился — release.mjs его не создал?" >&2
          exit 1

      - name: Долить .exe в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"

      # Ручной запуск: публиковать нечего, отдаём артефактом.
      - name: Артефакт (ручной запуск)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: swarm-windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    # 22.04, а не latest: бинарник терминала и сам Electron слинкованы с glibc раннера, и
    # чем он старее, тем на большем числе дистрибутивов запустится AppImage.
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # То же, что у Windows: node-pty приходит готовым под нашу цель Electron.
      - name: Зависимости
        run: npm ci
        env:
          npm_config_runtime: electron
          npm_config_target: 29.4.6
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # На Linux «npm ci» терминал под Electron НЕ ставит, и это не очевидно: в пакете
      # лежат готовые бинарники под обычную ноду (prebuilds/linux-x64/node.abi*.node), его
      # установщик находит подходящий для ноды раннера и на этом успокаивается. В Electron
      # же грузится build/Release/pty.node, которого тогда нет, — приложение открылось бы
      # без терминала. На маке и Windows таких бинарников в пакете нет, поэтому там
      # prebuild-install срабатывает сам. Здесь зовём его явно.
      - name: Терминал под Electron
        working-directory: node_modules/@homebridge/node-pty-prebuilt-multiarch
        run: node ../../prebuild-install/bin.js --runtime electron --target 29.4.6 --arch x64 --platform linux --verbose

      - name: Терминал собран под Linux
        run: |
          d=node_modules/@homebridge/node-pty-prebuilt-multiarch/build/Release
          file "$d/pty.node" | tee /dev/stderr | grep -q 'ELF 64-bit.*x86-64'
          test -x "$d/spawn-helper"

      - name: build-info.json
        run: node scripts/write-build-info.mjs

      # --publish never — по той же причине, что у Windows.
      - name: Сборка установщиков
        run: npm run dist:linux -- --publish never

      - name: Что собралось
        run: ls -la dist/*.AppImage dist/*.deb

      # scripts/install.sh не запускает AppImage, а распаковывает его и берёт оттуда
      # запускалку `AppRun` и иконку `swarm.png` по именам. Поменяй сборщик раскладку —
      # установка одной командой сломается молча, поэтому проверяем её здесь.
      - name: Раскладка AppImage, на которую опирается install.sh
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/swarm.png
          test -f squashfs-root/resources/app.asar.unpacked/node_modules/@homebridge/node-pty-prebuilt-multiarch/build/Release/pty.node

      - name: Дождаться черновика релиза
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "релиз $GITHUB_REF_NAME на месте"
              exit 0
            fi
            echo "ждём релиз $GITHUB_REF_NAME … ($i/30)"
            sleep 10
          done
          echo "релиз $GITHUB_REF_NAME так и не появился — release.mjs его не создал?" >&2
          exit 1

      - name: Долить AppImage и deb в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb --clobber --repo "$GITHUB_REPOSITORY"

      - name: Артефакт (ручной запуск)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: swarm-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    # Теперь релиз полон, и только теперь ему можно стать latest.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Опубликовать релиз
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
