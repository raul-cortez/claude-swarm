<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swarm</title>

  <!-- xterm assets are vendored locally (renderer/vendor) so paths work both in
       dev and in the packaged .app — the node_modules paths break once bundled. -->
  <link rel="stylesheet" href="./vendor/xterm.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="layout-rail">
  <!-- #chrome holds the session list + controls. In "rail" layout it's a
       vertical sidebar on the left; in "top" layout it's a horizontal bar of
       cards across the top. Same DOM, two CSS arrangements — toggle with ⌘L. -->
  <div id="chrome">
    <div id="brand">
      <span class="brand">swarm</span>
      <span class="brand-sub">claude sessions</span>
    </div>

    <!-- Sessions, grouped by working folder (built in JS). The "новая сессия"
         button is moved INTO #tabs by relayoutTabs so it flows right after the
         last group — see there. It lives here at load only so getElementById
         finds it before the first relayout. -->
    <div id="tabs"></div>
    <button id="new-session-folder" title="Новая сессия в папке… (⌘O)"><span class="ic">＋</span><span class="tx">новая сессия</span></button>
  </div>

  <!-- One xterm container per session, only the active one is shown. The pult
       strip + empty note live INSIDE the stage: body has two different grids
       (rail / top), so a new grid row would mean editing both. -->
  <main id="stage">
    <div id="pult-strip"></div>
    <div id="pult-empty">Никто не ждёт ответа</div>
    <!-- Shown for ~1.2s when the pult hands the terminal to the NEXT agent on
         its own. Filled by flashHandoff(); pointer-none so you can start typing
         the answer straight through it. -->
    <div id="pult-flash"></div>
  </main>

  <!-- Bottom status bar: git branch of the ACTIVE session's folder (VS Code
       style). Hidden entirely when that folder is not a git repo. -->
  <footer id="statusbar">
    <button id="git-branch" class="git-branch" hidden title="Git — ветка активной сессии">
      <span class="git-ic"></span>
      <span class="git-name"></span>
      <span class="git-track"></span>
    </button>
    <button id="git-diff" class="git-diff" hidden title="Изменения — показать дифф">
      <span class="d-add"></span>
      <span class="d-del"></span>
    </button>
    <span id="git-msg" class="git-msg"></span>
    <!-- Action icons (VS Code style), pinned to the right of the bar. -->
    <div id="bar-actions">
      <!-- Red "!" surfaces captured errors; click opens the logs modal. Hidden until an error occurs. -->
      <!-- Появляется, когда доступно обновление; клик открывает модалку апдейта. -->
      <button id="update-pill" class="update-pill" hidden></button>
      <button id="log-indicator" class="log-indicator" hidden title="Ошибки — показать логи"></button>
      <!-- «Где я»: за компом или за телефоном. Иконкой, а не текстом — подпись выключенного
           состояния читалась как объявление («отошёл»), и по ней нельзя было понять,
           включено что-то или нет. Сам выбор — в списке по клику. Прячется без привязанной
           группы (зеркалить некуда) и при галке «присылать итоги всех ходов всегда»
           (выбирать нечего — см. renderPresencePill). -->
      <button id="presence-pill" class="presence-pill" hidden></button>
      <button id="cmd-menu-btn" title="Быстрые команды (⌘K)"><span class="ic">☰</span><span class="tx">команды</span></button>
      <button id="settings-btn" title="Настройки (⌘,)"><span class="ic">⚙</span><span class="tx">настройки</span></button>
    </div>
  </footer>

  <!-- Branch popover (built in JS, reuses .cmd-menu look, anchored to #git-branch). -->
  <div id="git-menu" class="cmd-menu hidden"></div>

  <!-- Quick-commands popover (populated from JS, anchored to the burger button). -->
  <div id="cmd-menu" class="cmd-menu hidden"></div>

  <!-- «+» на папке: чем открыть эту вкладку (built in JS, reuses .cmd-menu look). -->
  <div id="launch-menu" class="cmd-menu hidden"></div>

  <!-- «Где я» — список из трёх положений, тот же вид, что у меню команд. -->
  <div id="presence-menu" class="cmd-menu hidden"></div>

  <!-- xterm core + fit + web-links addons
       (UMD globals: Terminal, FitAddon.FitAddon, WebLinksAddon.WebLinksAddon) -->
  <script src="./vendor/xterm.js"></script>
  <script src="./vendor/addon-fit.js"></script>
  <script src="./vendor/addon-web-links.js"></script>
  <!-- Terminal theme presets + appearance helpers (window.SWARM_THEMES). Must
       load before renderer.js, which reads it in makeXterm/applyAppearance. -->
  <script src="./themes.js"></script>
  <!-- Keybind defaults + match/format helpers (window.SWARM_KEYBINDS). -->
  <script src="./keybinds.js"></script>
  <!-- Claude session pin/resume helpers (window.SWARM_RESUME). -->
  <script src="./resume.js"></script>
  <!-- «Это запуск агента?» + разворачивание алиасов (window.SWARM_LAUNCH).
       Читает SWARM_RESUME, поэтому строго после resume.js. -->
  <script src="./launch-word.js"></script>
  <!-- In-app log ring buffer (window.SWARM_LOGSTORE). Before renderer.js. -->
  <script src="./logstore.js"></script>
  <!-- Tab card style: density presets + pure helpers (window.SWARM_TABSTYLE). -->
  <script src="./tabstyle.js"></script>
  <!-- Unified-diff parser + change-tree builder (window.SWARM_DIFF). Before renderer.js. -->
  <script src="./diffview.js"></script>
  <!-- «Agent is calling me» phrase matcher (window.SWARM_ASK_PHRASES). Shared with
       main/screen.js — the settings preview must match the real detector. -->
  <script src="../ask-phrases.js"></script>
  <script src="../agent-rules.js"></script>
  <!-- Самоперезапуск вкладки (window.SWARM_RESTART). Общий с main: границы ползунка в
       настройках и порог, по которому main спрашивает агента, — одно и то же число. -->
  <script src="../restart.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
